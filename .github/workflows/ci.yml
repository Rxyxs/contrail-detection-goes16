name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install numpy pytest requests
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pytest -q tests
        env:
          PYTHONPATH: src
